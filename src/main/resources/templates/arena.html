<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, width=device-width">
    <title>ARENA</title>
</head>

<style>
  body {
  background: url('https://img1.akspic.ru/crops/3/0/6/1/5/151603/151603-tuman-fentezi-solnechnyjsvet-prirodnyjlandshaft-cifrovoeiskusstvo-1920x1080.jpg');
  }
  .ara {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  }
  .ora {
  margin-top: 20px;
  display: flex;
  justify-content: space-around;
  }

  .wr {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  }
  .wn {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  }

  .red_blue {
  align-items: center;
  display: flex;
  justify-content: center;
  padding: 5px;
  }

  .bat_res {
  align-items: center;
  display: flex;
  justify-content: center;
  }

</style>

<script>
  function addItem() {
    alert("Изображение успешно сохранено в базу данных")
    }
</script>

<body>

<div class="ara"></div>

<img src="https://img2.akspic.ru/crops/9/9/2/1/4/141299/141299-feshn-art-zhenskij_pol-proizvedenie_iskusstva-samuraj-1920x1080.jpg" width="340" height="200">

<div class="ora">
  <div th:if="${not #lists.isEmpty(savedMage)}">
    <h2>Информация о маге:</h2>
    <p>Имя: <span th:text="${savedMage.name}"></span></p>
    <p>Сила: <span th:text="${savedMage.power}"></span></p>
    <img th:src="${savedMage.imageUrl}" alt="Изображение мага"/>
  </div>

  <form action="#" th:action="@{/mage/create}" method="post">
    <label for="name">Имя мага:</label><br/>
    <input type="text" id="name" name="name"/><br/>
    <label for="power">Сила мага:</label><br/>
    <input type="number" id="power" name="power"/><br/>
    <label for="mageImageUrl">URL изображения мага:</label><br/>
    <input type="text" id="mageImageUrl" name="mageImageUrl"/><br/><br/>
    <button type="submit">Создать мага</button>
  </form>


  <div th:if="${not #lists.isEmpty(savedArcher)}">
    <h2>Информация о лучнике:</h2>
    <p>Имя: <span th:text="${savedArcher.name}"></span></p>
    <p>Сила: <span th:text="${savedArcher.power}"></span></p>
    <img th:src="${savedArcher.imageUrl}" alt="Изображение лучника"/>
  </div>

  <form action="#" th:action="@{/archer/create}" method="post">
    <label for="name">Имя лучника:</label><br/>
    <input type="text" id="archer_name_" name="name"/><br/>
    <label for="power">Сила лучника:</label><br/>
    <input type="number" id="archer_power" name="power"/><br/>
    <label for="archerImageUrl">URL изображения лучника:</label><br/>
    <input type="text" id="archerImageUrl" name="archerImageUrl"/><br/><br/>
    <button type="submit">Создать лучника</button>
  </form>
</div>

<div class="bat_res">
  <form action="/results">
    <button type="submit">battle result</button>
  </form>
</div>

<div class="wn">
  <p data-th-text="${test3}"></p>
</div>

</body>
</html>


<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<head>
    <meta charset="UTF-8">
    <title>Результаты битвы</title>
    <style>

        body {
        background: linear-gradient(to right, #eacda3, #d6ae7b);
        }

        .etc {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        }

        .ig {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        }

        .red_blue {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .blue, .red {
            padding: 10px;
            border-radius: 5px;
            width: 200px;
            text-align: center;
        }
        .blue {
            background-color: lightblue;
            color: darkblue;
        }
        .red {
            background-color: pink;
            color: red;
        }
    </style>
</head>

<body>

<h1>Результаты битвы</h1>

<h1>Победитель!</h1>
<p th:if="${winner != null}">
    Имя победителя: <span th:text="${winner.winnerName}"></span><br />
    Сила победителя: <span th:text="${winner.winnerPower}"></span><br />
    <img th:src="${winner.winnerImageUrl}" alt="Изображение победителя" />
</p>
<p th:if="${winner == null}">
    Победителя нет!
</p>
<p th:if="${winner.winnerName == null}">
    Ничья!
</p>
<a href="/arena">Вернуться на арену</a>

</body>
</html>

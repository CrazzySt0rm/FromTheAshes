
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, width=device-width">
    <link th:href="@{/styles.css}" rel="stylesheet">
    <title>Результаты битвы</title>
    <style>

        body {
        background: linear-gradient(to right, #eacda3, #d6ae7b);
        }

        .ig {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        }

        .red_blue {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .blue, .red {
            padding: 10px;
            border-radius: 5px;
            width: 200px;
            text-align: center;
        }
        .blue {
            background-color: lightblue;
            color: darkblue;
        }
        .red {
            background-color: pink;
            color: red;
        }
    </style>
</head>

<body>

<!--<h1>Результаты битвы</h1>-->

<div class="etc">


    <div th:if="${winner != null}">
        <h1 th:if="${winner.winnerName != null}">Победитель!</h1>
        <h1 th:if="${winner.isTie()}">Ничья!</h1>

        <p th:if="${winner.winnerName != null}">
            Имя победителя: <span th:text="${winner.winnerName}"></span><br />
            Сила победителя: <span th:text="${winner.winnerPower}"></span><br />
            <img th:src="${winner.winnerImageUrl}" width="350" height="450" alt="Изображение победителя" />
        </p>

        <p th:if="${winner.isTie()}">
            <img th:src="${winner.winnerImageUrl}" alt="Изображение ничьей" />
        </p>
    </div>

    <p th:if="${winner == null}">
        Победителя нет!
    </p>

</div>

<div class="etc2">
    <a href="/arena">Вернуться на арену</a>
</div>

</body>
</html>

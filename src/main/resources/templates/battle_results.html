        .loser-image {
    position: relative;
    overflow: hidden; /* Скрываем лишние части линий */
}

.loser-image::before,
.loser-image::after {
    content: '';
    position: absolute;
    background-color: #321011;
    transition: all 0.5s ease-in-out; /* Время и плавность анимации */
    transform-origin: center; /* Центр вращения для анимации */
}

.loser-image::before { /* Горизонтальная линия */
    top: 50%;
    left: 0;
    width: 0; /* Начальное состояние - нулевая ширина */
    height: 4px;
    animation: drawHorizontalLine 0.75s forwards; /* Сокращенная длительность анимации */
}

.loser-image::after { /* Вертикальная линия */
    top: 0;
    left: 50%;
    width: 4px;
    height: 0; /* Начальное состояние - нулевая высота */
    animation: drawVerticalLine 0.75s 0.375s forwards; /* Задержка и сокращенная длительность */
}

@keyframes drawHorizontalLine {
    to {
        width: 100%; /* Полная ширина */
    }
}

@keyframes drawVerticalLine {
    to {
        height: 100%; /* Полная высота */
    }
}

.loser-image.animate::before {
    width: 100%; /* Полная ширина */
    animation: drawHorizontalLine 0.5s forwards; /* Запускаем анимацию */
}

.loser-image.animate::after {
    height: 100%; /* Полная высота */
    animation: drawVerticalLine 0.5s 0.25s forwards; /* Задержка перед началом анимации */
}

    </style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
    const loserSection = document.querySelector('.loser-section');
    if (loserSection) {
        const loserImage = loserSection.querySelector('.loser-image');
        if (loserImage) {
            const canvas = document.createElement('canvas');
            canvas.width = loserImage.clientWidth;
            canvas.height = loserImage.clientHeight;
            const ctx = canvas.getContext('2d');

            let firstDiagonalProgress = 0;
            let secondDiagonalProgress = 0;
            const lineSpeed = 5;

            function animateFirstDiagonalLine() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(firstDiagonalProgress * canvas.width / 100, firstDiagonalProgress * canvas.height / 100);
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = 4;
                ctx.stroke();

                firstDiagonalProgress += lineSpeed;

                if (firstDiagonalProgress <= 100) {
                    requestAnimationFrame(animateFirstDiagonalLine);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(canvas.width, canvas.height);
                    ctx.stroke();
                    animateSecondDiagonalLine();
                }
            }

            function animateSecondDiagonalLine() {
                ctx.beginPath();
                ctx.moveTo(canvas.width, 0);
                ctx.lineTo(canvas.width - secondDiagonalProgress * canvas.width / 100, secondDiagonalProgress * canvas.height / 100);
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = 4;
                ctx.stroke();

                secondDiagonalProgress += lineSpeed;

                if (secondDiagonalProgress <= 100) {
                    requestAnimationFrame(animateSecondDiagonalLine);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(canvas.width, 0);
                    ctx.lineTo(0, canvas.height);
                    ctx.stroke();
                }
            }

            animateFirstDiagonalLine();

            loserSection.style.position = 'relative';
            canvas.style.position = 'absolute';
            canvas.style.top = '50%';
            canvas.style.left = '50%';
            canvas.style.transform = 'translate(-50%, -50%)';
            canvas.style.marginTop = '48px';
            canvas.style.marginLeft = '0px';
            loserSection.appendChild(canvas);
        }
    }
});
</script>

<div th:if="${winner != null}">

            Сила победителя: <span th:text="${winner.winnerPower}"></span><br/>
            <img th:src="${winner.winnerImageUrl}" width="350" height="450" alt="Изображение победителя"/>
            </p>
        </div>

        <div class="loser-section">
            <p th:if="${winner.winnerName != null && !winner.isDraw()}">
            <h1>Проигравший</h1>
            Имя проигравшего: <span th:text="${winner.loserName}"></span><br/>
            Сила проигравшего: <span th:text="${winner.loserPower}"></span><br/>
            <img th:src="${winner.loserImageUrl}" width="350" height="450" alt="Изображение проигравшего"
                 class="loser-image"/>
            </p>

        </div>
    </div>

    <p th:if="${winner.isDraw()}">
        <img th:src="${winner.winnerImageUrl}" alt="Изображение ничьей"/>
    </p>
</div>

    Победителя нет!
